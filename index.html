['read','Мартин Иден','Джек Лондон',{g:['классика'],th:'Возможно, самая любимая книга. Среди книг Лондона: «Мартин Иден» > «Время не ждёт» > «Маленькая хозяйка большого дома».',my:'Бедный необразованный моряк Мартин Иден спасает юношу от избиения и ограбления; в благодарность тот приглашает его домой. Семья богатая и знатная, Мартина потрясают роскошь, количество книг и разрыв в развитии. Он знакомится с сестрой юноши Рут и влюбляется; решает достичь такого же достатка, получить образование и начать писать. Он читает и учится без устали, экономя каждую минуту, и постепенно становится человеком, разбирающимся в разных областях. Показывает Рут свои стихи — ей не нравится; он пишет снова и пытается продавать, но не берут или платят копейки. Потом его замечают и печатают, и другие начинают покупать его работы за большие деньги. Отношение к нему меняется, хотя для него самого ничего не изменилось. Он делает вывод, что дело не в таланте, а в удаче, признании и славе: люди мыслят стадом. Он отвергает всех, хозяйке дома дарит ранчо. Рут приходит мириться, он видит, что это инсценировано и дело в деньгах и славе, и отвергает её. Отправляется в плавание и там, погружённый в мысли, решает уйти из жизни. Конец.',idea:'Не смотри на общество как на лучшее только потому, что так кажется: не всё, что кажется чем-то, этим является. Человек может создать и улучшить себя; важно видеть границу между «быть» и «казаться». Вторая мысль — продажность общества: в человеке видят не личность, а богатого или известного. Люди должны видеть друг в друге людей, а не объект популярности или богатства. Ещё это книга о мужской депрессии и разочаровании в людях.'}],

['read','1984','Джордж Оруэлл',{g:['антиутопия'],th:'Первая книга, с которой началась серия чтения (около двух лет назад). Много общего с современностью, хотя в книге многое преувеличено.',my:'Тоталитарное государство контролирует граждан через разные службы (полиция мыслей, прослушка, шпионы, телеэкраны). Люди живут как в загоне, без своих мыслей, под Большим Братом, которого никто не видел. Главный герой — обычный человек, писавший политические статьи. Он влюбляется в девушку: они обмениваются записками в коридоре, встречаются в комнате над лавкой старика. Из экрана в комнате раздаётся голос, их объявляют арестованными, врывается полиция; владелец лавки оказывается агентом государства. Их пытают, используя главные страхи: герой боится крыс и на вопрос, кого отдать крысам, называет девушку — так предаёт её. Психика сломлена. Позже они встречаются в кафе и понимают, что оба не выдержали. По телевизору объявляют победу над Евразией, герой искренне радуется и осознаёт, что любит Большого Брата — он сломлен полностью.',idea:'Государство, которое контролирует всё, превращает жизнь людей в серую массу; важна свобода во всём — в любви, мыслях, действиях. Без свободы выбора и контроля над своей жизнью теряется смысл, и неважно, государство это или что-то меньшее: человек, потерявший контроль и выбор, теряет себя. Вторая идея: сломаться может любой, это зависит от условий и травмы психики, независимо от убеждений.'}],

['read','Отцы и дети','Иван Тургенев',{g:['классика'],th:'Женские образы (Фенечка, Анна Сергеевна, Катя) показаны каждый через любовь — как по-разному она устроена и воспринимается.',my:'Аркадий приезжает домой с другом Базаровым; тот сразу не ладит с Павлом Кирсановым. Друзья едут к родственнику в город, встречают Кукшину, попадают на бал и знакомятся с Анной Сергеевной, которая приглашает их погостить. Базаров признаётся ей в любви, она отказывает, боясь изменить свою упорядоченную жизнь. Друзья едут к родителям Базарова, скучают, возвращаются, снова заезжают к Анне Сергеевне, затем домой. Базаров целует Фенечку; Павел, тайно влюблённый в неё, вызывает его на дуэль, Базаров ранит его в ногу и перевязывает. Базаров уезжает, заезжает к Анне Сергеевне, но у них ничего не выходит. Аркадий делает предложение Кате. Базаров возвращается к родителям, режется при вскрытии больного и умирает. Родители навещают могилу; Аркадий занимается хозяйством и женится на Кате; Анна Сергеевна уезжает в Москву и выходит замуж; Павел уезжает в Европу; отец Аркадия женится на Фенечке.',idea:'Человек должен принять себя и свои чувства и быть настоящим, а не придумывать роли — они создают проблемы. Базаров был несчастен, потому что боялся признать себя влюблённым; Павел страдал от придуманной чопорности и высокомерия. Простые люди, принимающие себя и мир, имели больше шансов на счастье. Нельзя судить о целом поколении по паре людей: у каждой стороны были и противоположные примеры.'}],
['read','Мы','Евгений Замятин',{g:['антиутопия'],th:'Около 180 страниц; вторая половина тома — рассказы Замятина.',my:'Герой — Д-503, строитель дирижабля «Интеграл» и математик. Единое государство управляется партией после 200-летней войны; у людей номера вместо имён, они живут в прозрачных домах, всё под контролем. У него есть подруга О и коллега I-330, которая сначала ему не нравится. Она при нём пьёт и курит (строго запрещено) и поит его алкоголем; он начинает мыслить иначе, ему кажется, что у него появилась душа. Через фальшивого врача она достаёт ему липовую справку, он влюбляется. I рассказывает о планах революции, ведёт его подземными ходами за город к людям, живущим там. У героя раздвоение: к кому присоединиться. Позже Благодетель намекает, что его используют; он решает донести на заговорщиков; полицейский, которому он донёс, оказывается на стороне повстанцев. Они взрывают стену. В конце герой сидит с Благодетелем в комнате допросов, где пытают I; ему всё это интересно и красиво, и она умирает на его глазах.',idea:'Те же мысли, что в «1984»: жестокость государства и контроль над умами убивают суть человека — он становится орудием, пустым телом без души. Человек должен оставаться человеком: нормально быть разным и не соглашаться; подавляя в себе всё, что отличает его, и стремясь быть частью серой массы, он рано или поздно теряет себя.'}],

go(e){const t=e.dataset.to.split('.');cur=t[0];if(t[1]){if(cur=='plan')sub.plan=t[1];if(cur=='fin')sub.fin=t[1]}render()},
cfgopen(){cfgOpen=true;drawCfg()},

cfgtog(e){const c=hcfg(),k=e.dataset.k;c.hide[k]=c.hide[k]?0:1;commit()},
cfgmv(e){const c=hcfg(),i=+e.dataset.i,j=i+ +e.dataset.n;if(j<0||j>=c.order.length)return;[c.order[i],c.order[j]]=[c.order[j],c.order[i]];commit()},
gedit(e){const g=S.goals[+e.dataset.i];ask('Изменить цель',[{k:'n',l:'Название',v:g.n},{k:'t',l:'Нужная сумма, ₽',t:'num',v:String(g.t)},{k:'dl',l:'Срок (необязательно)',t:'date',v:g.dl||''}],o=>{if(!o.n||!N(o.t))return false;const old=g.n;Object.assign(g,{n:o.n,t:N(o.t),dl:o.dl||''});if(old!=g.n)S.dep.forEach(d=>{if(d.g==old)d.g=g.n})},'Сохранить')},
qa(e){const w=e.dataset.q;if(w=='exp'||w=='task'){const f=ADD[w=='exp'?'fin.exp':'plan'];ask(f[0],f[1].map(x=>({v:'',...x})),f[2]);return}
if(w=='dep'){if(!S.goals.length){toast('Сначала добавь цель в «Накоплениях»');return}OPTS.goal=S.goals.map((g,i)=>[String(i),g.n,'#34d399']);ask('Взнос в накопления',[{k:'g',l:'Цель',t:'sel',o:'goal',v:'0'},{k:'a',l:'Сумма, ₽',t:'num',v:''},{k:'d',l:'Дата',t:'date',v:TD}],o=>{const g=S.goals[+o.g],a=N(o.a);if(!g||!a)return false;g.s+=a;S.dep.push({d:o.d||TD,g:g.n,a});if((o.d||TD)==TD)autoHab('sav')},'Внести');return}
const L=S.habits.filter(h=>!h.ar&&(h.s=='t'||hdue(h,TD))&&!hdone(h,TD));if(!L.length){toast('На сегодня всё отмечено');return}OPTS.qh=L.map(h=>[h.id,h.n,h.c]);ask('Отметить привычку',[{k:'h',l:'Привычка',t:'sel',o:'qh',v:L[0].id},{k:'v',l:'Значение (для числовых; пусто — цель)',t:'num',v:''}],o=>{const h=S.habits.find(x=>x.id==o.h);if(!h)return false;h.d[TD]=h.t=='n'?(N(o.v)||hg(h)||1):1},'Отметить')},
calf(e){const h=e.previousElementSibling;calOpen(e,h.value,v=>{h.value=v;e.querySelector('span').textContent=DF(v)},{clear:1})},

sf(e){const s=S.dbt.src[+e.dataset.i],f=e.dataset.f;if(f=='n')s.n=e.value.trim()||s.n;else s[f]=N(e.value);commit()},
th(){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem(T,t)}catch(x){}},
exp(){ask('Резервная копия',[{k:'j',l:'Скопируй этот текст и сохрани в заметках или файле',t:'area',v:JSON.stringify(S)}],()=>{},'Готово')},
imp(){ask('Импорт',[{k:'j',l:'Вставь сохранённую копию. Текущие данные будут заменены.',t:'area'}],o=>{try{const j=JSON.parse(o.j);if(!j.dbt)throw 0;S=j}catch(x){toast('Не получилось прочитать копию');return false}},'Импортировать')},
add(){const k=cur=='fin'?'fin.'+sub.fin:cur=='books'?'books.'+sub.books:cur,f=ADD[k];ask(f[0],f[1].map(x=>({v:'',...x})),f[2])},
del(e){if(e.dataset.s){if(e.dataset.l=='dep'){const d=S.dep[+e.dataset.i],g=d&&S.goals.find(x=>x.n==d.g);if(g)g.s=Math.max(0,g.s-d.a)}e.dataset.l.split('.').reduce((o,k)=>o[k],S).splice(+e.dataset.i,1);commit();toast(e.dataset.l=='dep'?'Взнос удалён, накопления пересчитаны':'Удалено');return}e.dataset.s=1;const t=e.textContent;e.textContent='Точно?';e.classList.add('sure');setTimeout(()=>{e.dataset.s='';e.textContent=t;e.classList.remove('sure')},3000)},
paid(e){S.debts[+e.dataset.i].p=N(e.value);commit()},
task(e){const t=S.tasks[+e.dataset.i];t.f=t.f?0:1;commit()},
hab(e){const h=S.habits[+e.dataset.i],k=e.dataset.k||TD;h.d[k]?delete h.d[k]:h.d[k]=1;commit()},
dep(e){const g=S.goals[+e.dataset.i];ask('Взнос: '+E(g.n),[{k:'a',l:'Сумма, ₽',t:'num',v:''},{k:'d',l:'Дата',t:'date',v:TD}],o=>{const a=N(o.a);if(!a)return false;g.s+=a;S.dep.push({d:o.d||TD,g:g.n,a});if((o.d||TD)==TD)autoHab('sav')},'Внести')},
};

/* ---- GitHub sync (only in the hosted site build) ---- */
(()=>{const SK='lc-sync';let SY={};try{SY=JSON.parse(localStorage.getItem(SK))||{}}catch(e){}
const pSY=()=>{try{localStorage.setItem(SK,JSON.stringify(SY))}catch(e){}};
const enc=t=>btoa(unescape(encodeURIComponent(t))),dec=t=>decodeURIComponent(escape(atob(t.replace(/\s/g,''))));
const url=()=>`https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}/contents/${(SY.path||'data.json').split('/').map(encodeURIComponent).join('/')}`;
const H=()=>({Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json'});
const stS=(t,w)=>{const e=$('#sy');if(e){e.textContent=t;e.style.color=w?'var(--warn)':''}};
let busy=false,again=false,pt;
async function pull(){const r=await fetch(url()+'?ref='+encodeURIComponent(SY.branch||'main')+'&_='+Date.now(),{cache:'no-store',headers:H()});if(r.status==404)return{data:null,sha:null};if(!r.ok)throw new Error(r.status);const j=await r.json();return{data:JSON.parse(dec(j.content)),sha:j.sha}}
async function push(sha){const b={message:'sync '+new Date().toISOString().slice(0,16),content:enc(JSON.stringify(S)),branch:SY.branch||'main'};if(sha)b.sha=sha;const r=await fetch(url(),{method:'PUT',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);const j=await r.json();SY.sha=j.content.sha;SY.ts=S.ts;pSY()}
const take=(d,sha)=>{localStorage.setItem(K,JSON.stringify(d));SY.sha=sha;SY.ts=d.ts||0;pSY();location.reload()};
const fmt=t=>t?new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'—';
function conflict(d,sha){document.querySelectorAll('.ov.sc').forEach(x=>x.remove());const m=document.createElement('div');m.className='ov sc';m.innerHTML=`<div class="md"><h3>Данные на GitHub и на этом устройстве различаются</h3><div class="sub">На GitHub: ${fmt(d.ts)}<br>На этом устройстве: ${fmt(S.ts)}<br>Выбери, какие оставить. Вторые будут заменены.</div><div class="row"><button class="b pri" id="sr">Взять с GitHub</button><button class="b" id="sl">Оставить на устройстве</button></div></div>`;document.body.append(m);
m.querySelector('#sr').onclick=()=>{m.remove();take(d,sha)};m.querySelector('#sl').onclick=async()=>{m.remove();try{busy=true;await push(sha);stS('GitHub · синхронизировано')}catch(e){stS('GitHub · нет связи ('+e.message+')',1)}busy=false}}
async function syncNow(){if(!SY.token){stS('Синхронизация выключена');return}if(busy){again=true;return}busy=true;stS('GitHub · синхронизация…');
try{const{data,sha}=await pull();
if(!data){await push(null)}
else if(!SY.sha){conflict(data,sha);busy=false;return}
else if(sha==SY.sha){if((S.ts||0)>(SY.ts||0))await push(sha)}
else if((S.ts||0)>(SY.ts||0)){conflict(data,sha);busy=false;return}
else{take(data,sha);return}
stS('GitHub · синхронизировано '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}))}
catch(e){stS('GitHub · нет связи ('+(e.message||'ошибка')+')',1)}
busy=false;if(again){again=false;syncNow()}}
window.__onSave=()=>{if(!SY.token)return;clearTimeout(pt);stS('GitHub · есть несинхронизированные изменения',1);pt=setTimeout(syncNow,2000)};
A.syncnow=()=>syncNow();
A.syncset=()=>ask('Синхронизация с GitHub',[{k:'t',l:'Токен GitHub (fine-grained, Contents: Read and write). Пусто — отключить',t:'pw',v:SY.token||''},{k:'o',l:'Логин владельца репозитория',v:SY.owner||''},{k:'r',l:'Репозиторий с данными (лучше приватный)',v:SY.repo||''},{k:'p',l:'Файл',v:SY.path||'data.json'},{k:'b',l:'Ветка',v:SY.branch||'main'}],o=>{if(!o.t){SY={};pSY();stS('Синхронизация выключена');return}if(!o.o||!o.r)return false;const ch=o.o!=SY.owner||o.r!=SY.repo||(o.p||'data.json')!=(SY.path||'data.json');SY={...SY,token:o.t,owner:o.o,repo:o.r,path:o.p||'data.json',branch:o.b||'main'};if(ch){delete SY.sha;delete SY.ts}pSY();setTimeout(syncNow,150)},'Сохранить и проверить');
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SY.token)syncNow()});window.addEventListener('online',()=>{if(SY.token)syncNow()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>{if(SY.token)syncNow();else stS('Синхронизация выключена')},50);
})();
st('Данные в этом браузере');render();
